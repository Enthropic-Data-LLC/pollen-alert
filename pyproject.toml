[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pollen-alert"
version = "1.0.0"
description = "Self-hostable personalized pollen forecast and alert system"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["pollen", "allergy", "forecast", "notification", "raspberry-pi"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = []  # Zero runtime deps — stdlib only

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.scripts]
pollen-alert = "pollen_alert.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pollen_alert*"]
